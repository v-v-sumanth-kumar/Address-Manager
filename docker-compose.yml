services:
  api:
    build: .
    container_name: address-book-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Address Book API
      - APP_VERSION=1.0.0
      - DEBUG=false
      - DATABASE_URL=sqlite:///./data/address_book.db
      - LOG_LEVEL=INFO
      - DEFAULT_PAGE_SIZE=10
      - MAX_PAGE_SIZE=100
    volumes:
      - address_book_data:/app/data
    restart: unless-stopped

volumes:
  address_book_data:
